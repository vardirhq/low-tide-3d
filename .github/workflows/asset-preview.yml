name: Asset preview

# Edit or add a spec in art/drafts/ (from the GitHub app or website, or by an
# agent) and open a pull request. This builds each changed spec, commits its
# preview sheet to the pull request and posts the previews and reports as a
# comment, so assets can be reviewed from a phone.
on:
  pull_request:
    paths: ["art/drafts/*.py"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: asset-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Specs are Python, and this job can push: only branches of this
    # repository, whose authors already have write access, are built.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install asset tools
        run: python -m pip install --disable-pip-version-check numpy scipy pillow
      - name: Build changed specs
        id: build
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p art/drafts/previews
          changed=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'art/drafts/*.py')
          echo "Specs: $changed"
          : > "$RUNNER_TEMP/comment.md"
          echo "### Asset previews" >> "$RUNNER_TEMP/comment.md"
          failed=0
          for spec in $changed; do
            if python3 scripts/asset.py "$spec" > "$RUNNER_TEMP/out.txt" 2>&1; then status="clean"; else status="needs fixes"; failed=1; fi
            cat "$RUNNER_TEMP/out.txt"
            name=$(sed -n 's/^asset *//p' "$RUNNER_TEMP/out.txt" | head -1)
            {
              echo
              echo "#### \`$spec\` — $status"
              if [ -n "$name" ] && [ -f "art/drafts/out/${name}_preview.png" ]; then
                cp "art/drafts/out/${name}_preview.png" "art/drafts/previews/${name}.png"
                echo "![${name}](PREVIEW_URL/art/drafts/previews/${name}.png)"
              fi
              echo
              echo '```'
              sed '/^preview /d' "$RUNNER_TEMP/out.txt"
              echo '```'
            } >> "$RUNNER_TEMP/comment.md"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Commit previews to the pull request
        id: commit
        run: |
          git add art/drafts/previews
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Asset previews"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Post previews
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.commit.outputs.sha }}
        run: |
          sed -i "s#PREVIEW_URL#$URL#g" "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/comment.md"
      - name: Fail when a spec needs fixes
        if: steps.build.outputs.failed == '1'
        run: |
          echo "::error::At least one asset has errors; see the preview comment."
          exit 1
