name: Tidebreaker crane assets
on:
  pull_request:
    paths:
      - 'scripts/build_tidebreaker.py'
      - 'scripts/review_tidebreaker.py'
      - 'Low_Tide_Kit/build_kit.py'
      - '.github/workflows/tidebreaker.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy pillow
      - name: Generate modular crane GLBs
        run: python scripts/build_tidebreaker.py
      - name: Render assembled crane review sheet
        run: python scripts/review_tidebreaker.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json, pathlib, struct
          root = pathlib.Path('Low_Tide_Kit')
          rig = json.loads((root / 'tidebreaker_rig.json').read_text())
          assert len(rig['nodes']) == 6 and len(rig['outriggers']) == 4
          for p in root.glob('modules/tidebreaker_*.glb'):
              data = p.read_bytes()
              assert data[:4] == b'glTF' and struct.unpack_from('<I', data, 8)[0] == len(data)
              print(p, len(data))
          assert len(list(root.glob('modules/tidebreaker_*.glb'))) == 7
          PY
      - run: python -m unittest discover -s tests
      - uses: actions/upload-artifact@v4
        with:
          name: tidebreaker-modular-glbs
          path: |
            Low_Tide_Kit/modules/tidebreaker_*.glb
            Low_Tide_Kit/tidebreaker_rig.json
            Low_Tide_Kit/tidebreaker_review.png
            Low_Tide_Kit/tidebreaker_review.json
      - name: Publish assembled review to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            dir="$RUNNER_TEMP/tidebreaker-previews"
            rm -rf "$dir"
            git worktree prune
            if git fetch -q origin asset-previews; then
              git worktree add -q --detach "$dir" FETCH_HEAD
            else
              git worktree add -q --detach "$dir"
              (cd "$dir" && git checkout -q --orphan asset-previews && git rm -rfq . && git clean -fdq)
            fi
            mkdir -p "$dir/pr-$PR"
            cp Low_Tide_Kit/tidebreaker_review.png "$dir/pr-$PR/tidebreaker_review.png"
            (cd "$dir" && git add -A && { git diff --cached --quiet || git commit -qm "Tidebreaker preview for #$PR"; })
            if (cd "$dir" && git push -q origin HEAD:refs/heads/asset-previews); then
              sha=$(cd "$dir" && git rev-parse HEAD)
              url="https://raw.githubusercontent.com/$REPO/$sha/pr-$PR/tidebreaker_review.png"
              printf '### Tidebreaker assembled review\n\n![Tidebreaker crane](%s)\n\nSingle assembled inspection pose; seven modular GLBs remain separate for gameplay.\n' "$url" > "$RUNNER_TEMP/tidebreaker-comment.md"
              gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/tidebreaker-comment.md"
              exit 0
            fi
            git worktree remove --force "$dir" || true
            sleep 5
          done
          echo "::error::Could not publish assembled crane preview"
          exit 1
