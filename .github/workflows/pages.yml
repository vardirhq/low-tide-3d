name: Low Tide 3D WebGPU preview
on:
  push:
    branches: [main, poc/isometric-crawler, integration/sindri-3d]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: low-tide-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Low Tide
        uses: actions/checkout@v4
        with:
          path: low-tide-3d
      - name: Checkout Sindri 3D PR #507
        uses: actions/checkout@v4
        with:
          repository: vardirhq/sindri-engine
          ref: ccr-4791a75f-7rfx8g
          path: sindri-engine
      - name: Identify Sindri revision
        id: sindri-revision
        working-directory: sindri-engine
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore compiled browser player
        id: player-cache
        uses: actions/cache@v4
        with:
          path: sindri-engine/cached-player
          key: sindri-player-web-v1-${{ runner.os }}-rust-1.95.0-${{ steps.sindri-revision.outputs.sha }}
      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sindri-engine -> target
          key: low-tide-web
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libvulkan1 mesa-vulkan-drivers
      - name: Generate clean crawler base
        working-directory: low-tide-3d
        run: python3 scripts/make_clean_crawler.py
      - name: Validate crawler module layout
        working-directory: low-tide-3d
        run: python3 -m unittest discover -s tests -p 'test_crawler_modules.py'
      - name: Validate equipment slot contract
        working-directory: low-tide-3d
        run: python3 scripts/validate_equipment_slots.py
      - name: Export Low Tide scene
        working-directory: sindri-engine
        run: cargo run -p sindri-export --bin sindri-export -- ../low-tide-3d "$RUNNER_TEMP/low-tide-web" --base /low-tide-3d/
      - name: Build current Sindri player
        if: steps.player-cache.outputs.cache-hit != 'true'
        working-directory: sindri-engine
        run: cargo build --release -p sindri-player --lib --target wasm32-unknown-unknown
      - name: Cache wasm-bindgen CLI
        if: steps.player-cache.outputs.cache-hit != 'true'
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ hashFiles('sindri-engine/Cargo.lock') }}
      - name: Install wasm-bindgen CLI matching Cargo.lock
        if: steps.player-cache.outputs.cache-hit != 'true' && steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        working-directory: sindri-engine
        shell: bash
        run: |
          version=$(awk '/name = "wasm-bindgen"/ { found=1; next } found && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          test -n "$version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Generate and cache browser player
        if: steps.player-cache.outputs.cache-hit != 'true'
        working-directory: sindri-engine
        run: |
          mkdir -p cached-player
          wasm-bindgen target/wasm32-unknown-unknown/release/sindri_player.wasm --target web --out-dir cached-player --out-name sindri_player
      - name: Copy browser player into export
        run: |
          mkdir -p "$RUNNER_TEMP/low-tide-web/pkg"
          cp sindri-engine/cached-player/sindri_player.js sindri-engine/cached-player/sindri_player_bg.wasm "$RUNNER_TEMP/low-tide-web/pkg/"
          touch "$RUNNER_TEMP/low-tide-web/.nojekyll"
      - name: Check export
        run: |
          test -s "$RUNNER_TEMP/low-tide-web/index.html"
          test -s "$RUNNER_TEMP/low-tide-web/pkg/sindri_player.js"
          test -s "$RUNNER_TEMP/low-tide-web/pkg/sindri_player_bg.wasm"
          grep -q '/low-tide-3d/' "$RUNNER_TEMP/low-tide-web/index.html"
      - name: Upload build preview
        uses: actions/upload-artifact@v4
        with:
          name: low-tide-web-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/low-tide-web
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/low-tide-web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
